name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  safe-static-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run backend tests
        run: python3 -m unittest discover -s tests -v

      - name: Run widget model tests
        run: node tests/model.test.mjs

      - name: Check shell syntax
        run: bash -n install uninstall bin/nitroctl bin/nitro-report

      - name: Check JSON files
        run: |
          python3 -m json.tool manifest.json >/dev/null
          python3 -m json.tool driver/verified-models.json >/dev/null

      - name: Verify bundled driver checksums
        working-directory: driver/acer-wmi-anv16-0.1.0
        run: sha256sum --check --strict SHA256SUMS

      - name: Verify privileged release payload
        run: sha256sum --check --strict release-manifest.sha256

      # CI intentionally never runs the root installer, loads a kernel module,
      # connects to real hwmon files, or sends a fan-control command.
